<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Tareas con Redis y Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">

        <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center">
            📋 Lista de Tareas (Redis)
        </h1>

        <form action="/add" method="POST" class="flex space-x-2 mb-6">
            <input 
                type="text" 
                name="tarea" 
                placeholder="¿Qué necesitas hacer?" 
                class="flex-grow p-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" 
                required>
            <button 
                type="submit" 
                class="bg-blue-600 text-white px-5 py-3 rounded-md font-semibold hover:bg-blue-700 transition duration-200">
                Agregar
            </button>
        </form>

        <div>
            <h2 class="text-xl font-semibold text-gray-700 mb-3">Tareas Pendientes</h2>
            <ul class="space-y-3">
                
                {% for tarea in tareas %}
                    <li class="bg-gray-50 p-3 rounded-md flex justify-between items-center shadow-sm border border-gray-200">
                        <span class="text-gray-800">{{ tarea }}</span>
                        
                        <form action="/delete" method="POST">
                            <input type="hidden" name="tarea_a_borrar" value="{{ tarea }}">
                            <button 
                                type="submit" 
                                class="bg-red-600 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-red-700 transition duration-200">
                                Borrar
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="text-gray-500 text-center py-3">
                        ¡No hay tareas pendientes!
                    </li>
                {% endfor %}
            </ul>
        </div>

    </div>
</body>
</html>
